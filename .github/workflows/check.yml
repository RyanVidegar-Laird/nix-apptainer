name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://nix-apptainer.cachix.org
            extra-trusted-public-keys = nix-apptainer.cachix.org-1:KQ5mUFLDjlRGR9IlYnoF8ptgGIJcF8zgbz/Wy+VB6Cg=

      # Skips pushing when CACHIX_AUTH_TOKEN is unavailable (fork PRs);
      # pushFilter excludes the giant artifacts: full rootfs copy
      # (nix-apptainer-sandbox), squashfs, and the SIF itself — they are
      # distributed via GitHub Releases, and the free tier is 5 GB.
      - uses: cachix/cachix-action@v17
        with:
          name: nix-apptainer
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilter: '(-nix-apptainer-sandbox|-nix-apptainer-squashfs|\.sif)$'

      - name: Flake checks
        run: nix flake check -L

      - name: VM lifecycle test (KVM)
        if: matrix.system == 'x86_64-linux'
        run: nix build .#vm-test -L
