[package]
name = "nix-apptainer"
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
xdg = "3.0"
indicatif = "0.18"
reqwest = { version = "0.13", features = ["blocking", "rustls", "webpki-roots", "json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
nix = { version = "0.31", features = ["fs", "user"], default-features = false }
toml = "1.1"

[dev-dependencies]
tempfile = "3"
